  <script>
    const raw = "# T\u00c0I LI\u1ec6U H\u01af\u1edaNG D\u1eaaN T\u00cdCH H\u1ee2P VIDEO AI (OPENAI VIDEOS API STANDARD)\n> H\u1ec7 th\u1ed1ng C\u1ed5ng API TuanSu (`tuansuapi.store` / `api.xompet.io.vn`)\n\nH\u1ec7 th\u1ed1ng h\u1ed7 tr\u1ee3 chu\u1ea9n **OpenAI Videos API** (`/v1/videos`), cho ph\u00e9p b\u1ea1n d\u1ec5 d\u00e0ng t\u1ea1o video b\u1eb1ng AI t\u1eeb v\u0103n b\u1ea3n (Text-to-Video), t\u1ea1o chuy\u1ec3n \u0111\u1ed9ng t\u1eeb \u1ea3nh (Image-to-Video), gh\u00e9p nhi\u1ec1u nh\u00e2n v\u1eadt/phong c\u00e1ch t\u1eeb 1\u201310 \u1ea3nh tham chi\u1ebfu, t\u1ea1o video t\u1eeb \u1ea3nh \u0111\u1ea7u v\u00e0 \u1ea3nh cu\u1ed1i (First + Last frame), upscale Full HD 1080p v\u00e0 h\u1ee7y task video ch\u01b0a x\u1eed l\u00fd.\n\n---\n\n## 1. TH\u00d4NG TIN K\u1ebeT N\u1ed0I CHUNG\n\n- **Base URL:**\n  - `https://tuansuapi.store/v1` (Khuy\u00ean d\u00f9ng)\n  - `https://api.xompet.io.vn/v1`\n- **Authentication:** `Authorization: Bearer <API_KEY_C\u1ee6A_B\u1ea0N>` (V\u00ed d\u1ee5: `sk-9r-...`)\n- **T\u01b0\u01a1ng th\u00edch:** Th\u01b0 vi\u1ec7n ch\u00ednh th\u1ee9c `openai` (Python, Node.js), HTTP cURL, Requests, Axios, Fetch...\n\n---\n\n## 2. DANH S\u00c1CH MODEL V\u00c0 T\u00cdNH N\u0102NG\n\n| Model | Th\u1eddi l\u01b0\u1ee3ng (`seconds`) | \u1ea2nh tham chi\u1ebfu (`input_reference`) | T\u1ec9 l\u1ec7 (`aspect_ratio` / `size`) | First + Last frame (`last_frame`) | Video-to-Video (`input_video`) | \u0110\u1ed9 ph\u00e2n gi\u1ea3i (`resolution`) | \u0110\u1eb7c \u0111i\u1ec3m n\u1ed5i b\u1eadt |\n|---|---|---|---|---|---|---|---|\n| **`seedance_2.0_fast`** | 5, 10, 15s | 1 \u2013 10 \u1ea3nh | 9:16, 16:9, 1:1, 3:4, 4:3, 21:9 | \u2014 | \u2014 | 720p | Render c\u1ef1c nhanh, t\u1ed1i \u01b0u chi ph\u00ed |\n| **`seedance_2.5`** | 5, 10, 15, 20, 25, 30s | 1 \u2013 10 \u1ea3nh | 9:16, 16:9, 1:1, 3:4, 4:3, 21:9 | \u2014 | \u2014 | 720p | Ch\u1ea5t l\u01b0\u1ee3ng \u0111i\u1ec7n \u1ea3nh \u0111\u1ec9nh cao |\n| **`Veo-3.1`** | 4, 6, 8s | 1 \u2013 3 \u1ea3nh | 9:16, 16:9 | \u2713 (khi c\u00f3 1 \u1ea3nh \u0111\u1ea7u) | \u2014 | 720p, 1080p | Google DeepMind, m\u01b0\u1ee3t m\u00e0 |\n| **`Omni-Flash`** | 5, 10s | 1 \u2013 3 \u1ea3nh | 9:16, 16:9 | \u2014 | \u2713 (URL video MP4) | 720p | Gemini Vision bi\u1ebfn \u0111\u1ed5i video |\n\n---\n\n## 3. C\u00c1C ENDPOINT API\n\n### 3.1. T\u1ea1o Video Job: `POST /v1/videos`\n\nT\u1ea1o m\u1ed9t ti\u1ebfn tr\u00ecnh render video. \u0110\u1ecbnh d\u1ea1ng g\u1eedi l\u00ean c\u00f3 th\u1ec3 l\u00e0 `application/json` ho\u1eb7c `multipart/form-data`.\n\n#### B\u1ea3ng tham s\u1ed1:\n| Tham s\u1ed1 | Ki\u1ec3u d\u1eef li\u1ec7u | B\u1eaft bu\u1ed9c | M\u00f4 t\u1ea3 & Gi\u00e1 tr\u1ecb h\u1ee3p l\u1ec7 |\n|---|---|---|---|\n| `model` | string | **C\u00d3** | T\u00ean model (`seedance_2.0_fast`, `seedance_2.5`, `Veo-3.1`, `Omni-Flash`) |\n| `prompt` | string | **C\u00d3** | C\u00e2u l\u1ec7nh m\u00f4 t\u1ea3 video c\u1ea7n t\u1ea1o (h\u1ed7 tr\u1ee3 c\u1ea3 ti\u1ebfng Vi\u1ec7t v\u00e0 ti\u1ebfng Anh) |\n| `seconds` | int / string | Kh\u00f4ng | Th\u1eddi l\u01b0\u1ee3ng video (m\u1eb7c \u0111\u1ecbnh: `5`). Xem b\u1ea3ng model \u1edf tr\u00ean. |\n| `size` | string | Kh\u00f4ng | K\u00edch th\u01b0\u1edbc khung h\u00ecnh: `720x1280` (m\u1eb7c \u0111\u1ecbnh), `1280x720`, `1024x1792`, `1792x1024`. Seedance h\u1ed7 tr\u1ee3 th\u00eam: `1024x1024`, `768x1024`, `1024x768`, `1680x720`. |\n| `aspect_ratio` | string | Kh\u00f4ng | T\u1ec9 l\u1ec7 khung h\u00ecnh (thay th\u1ebf cho `size`): `9:16`, `16:9`, `1:1`, `3:4`, `4:3`, `21:9`. |\n| `input_reference` | object / array / file | Kh\u00f4ng | \u1ea2nh tham chi\u1ebfu (t\u1ed1i \u0111a 10 \u1ea3nh v\u1edbi Seedance, 3 \u1ea3nh v\u1edbi Veo/Omni).<br>\u2022 JSON 1 \u1ea3nh: `{\"image_url\": \"https://...\"}`<br>\u2022 JSON nhi\u1ec1u \u1ea3nh: `[{\"image_url\": \"url1\"}, {\"image_url\": \"url2\"}]`<br>\u2022 Multipart: g\u1eedi nhi\u1ec1u tr\u01b0\u1eddng file c\u00f9ng t\u00ean `input_reference`. |\n| `last_frame` | object / file | Kh\u00f4ng | \u1ea2nh k\u1ebft th\u00fac video (ch\u1ebf \u0111\u1ed9 First + Last frame m\u01b0\u1ee3t m\u00e0 tr\u00ean `Veo-3.1`). \u0110i k\u00e8m v\u1edbi 1 `input_reference` (\u1ea3nh \u0111\u1ea7u). |\n| `input_video` | string / object | Kh\u00f4ng | Link URL file video g\u1ed1c cho Video-to-Video (`Omni-Flash`). |\n| `resolution` | string | Kh\u00f4ng | \u0110\u1eb7t `1080p` \u0111\u1ec3 upscale Full HD (h\u1ed7 tr\u1ee3 tr\u00ean `Veo-3.1`). M\u1eb7c \u0111\u1ecbnh: `720p`. |\n\n> **Ch\u1ebf \u0111\u1ed9 \u0110\u1ed3ng b\u1ed9 (Synchronous keep-alive):**  \n> M\u1eb7c \u0111\u1ecbnh theo chu\u1ea9n OpenAI SDK, API tr\u1ea3 v\u1ec1 ngay tr\u1ea1ng th\u00e1i `queued` k\u00e8m `id` \u0111\u1ec3 \u1ee9ng d\u1ee5ng t\u1ef1 poll.  \n> N\u1ebfu b\u1ea1n mu\u1ed1n g\u1eedi request v\u00e0 **ch\u1edd nh\u1eadn lu\u00f4n link video cu\u1ed1i c\u00f9ng** trong m\u1ed9t l\u1ea7n g\u1ecdi (c\u00f3 s\u1eb5n ph\u00e1t xung keepalive ch\u1ed1ng timeout Cloudflare), ch\u1ec9 c\u1ea7n th\u00eam query `?sync=true` v\u00e0o URL:  \n> `POST https://tuansuapi.store/v1/videos?sync=true`\n\n---\n\n### 3.2. Tra c\u1ee9u tr\u1ea1ng th\u00e1i: `GET /v1/videos/{video_id}`\n\nTruy v\u1ea5n ti\u1ebfn \u0111\u1ed9 c\u1ee7a job render. Th\u1ef1c hi\u1ec7n l\u1eb7p (poll) sau m\u1ed7i 5\u201310 gi\u00e2y cho \u0111\u1ebfn khi ho\u00e0n th\u00e0nh:\n\n```json\n{\n  \"id\": \"video_abc123\",\n  \"object\": \"video\",\n  \"model\": \"seedance_2.5\",\n  \"status\": \"completed\",\n  \"progress\": 100,\n  \"created_at\": 1790567494,\n  \"completed_at\": 1790567670,\n  \"prompt\": \"A majestic eagle soaring over snow-capped mountains\",\n  \"size\": \"1280x720\",\n  \"seconds\": \"10\",\n  \"error\": null\n}\n```\n\n**C\u00e1c tr\u1ea1ng th\u00e1i (`status`):**\n- `queued`: \u0110\u00e3 nh\u1eadn job, \u0111ang ch\u1edd t\u00e0i nguy\u00ean server.\n- `in_progress`: \u0110ang render video.\n- `completed`: Ho\u00e0n t\u1ea5t th\u00e0nh c\u00f4ng, c\u00f3 th\u1ec3 t\u1ea3i video.\n- `failed`: Th\u1ea5t b\u1ea1i (xem m\u00e3 l\u1ed7i trong `error`).\n\n---\n\n### 3.3. T\u1ea3i file video MP4: `GET /v1/videos/{video_id}/content`\n\nT\u1ea3i tr\u1ef1c ti\u1ebfp binary stream c\u1ee7a file `.mp4` (ho\u1eb7c `GET /v1/videos/{video_id}/content?variant=video`).  \nEndpoint n\u00e0y tr\u1ea3 v\u1ec1 tr\u1ef1c ti\u1ebfp \u0111\u1ecbnh d\u1ea1ng `video/mp4` \u0111\u1ec3 l\u01b0u v\u1ec1 m\u00e1y.\n\n---\n\n### 3.4. H\u1ee7y b\u1ecf task video: `DELETE /v1/videos/{video_id}`\n\nCho ph\u00e9p h\u1ee7y b\u1ecf m\u1ed9t job video \u0111ang trong tr\u1ea1ng th\u00e1i h\u00e0ng \u0111\u1ee3i (`queued`).  \n- **Kh\u00f4ng b\u1ecb tr\u1eeb ti\u1ec1n** khi h\u1ee7y th\u00e0nh c\u00f4ng.  \n- N\u1ebfu video \u0111\u00e3 b\u1eaft \u0111\u1ea7u render (`in_progress`) ho\u1eb7c \u0111\u00e3 xong (`completed`), API s\u1ebd tr\u1ea3 v\u1ec1 `409 Conflict`.\n\n---\n\n## 4. B\u1ea2NG GI\u00c1 CHI TI\u1ebeT\n\nH\u1ec7 th\u1ed1ng t\u00ednh c\u01b0\u1edbc theo s\u1ed1 gi\u00e2y video \u0111\u01b0\u1ee3c t\u1ea1o th\u00e0nh c\u00f4ng:\n- **`seedance_2.0_fast`:** 5s: 1.100\u0111 | 10s: 2.100\u0111 | 15s: 3.400\u0111\n- **`seedance_2.5`:** 5s: 1.300\u0111 | 10s: 2.400\u0111 | 15s: 3.500\u0111 | 20s/25s/30s: 6.000\u0111\n- **`Veo-3.1`:** 1.400\u0111 / video\n- **`Omni-Flash`:** 2.200\u0111 / video\n- *L\u01b0u \u00fd:* Th\u00eam \u1ea3nh tham chi\u1ebfu, last_frame, upscale 1080p kh\u00f4ng t\u00ednh th\u00eam ph\u1ee5 ph\u00ed! Job b\u1ecb l\u1ed7i do h\u1ec7 th\u1ed1ng ho\u1eb7c h\u1ee7y qua DELETE \u0111\u1ec1u \u0111\u01b0\u1ee3c ho\u00e0n 100% ti\u1ec1n.\n\n---\n\n## 5. CODE M\u1eaaU CHI TI\u1ebeT\n\n### 5.1. Python (S\u1eed d\u1ee5ng OpenAI SDK ch\u00ednh th\u1ee9c)\n\nChu\u1ea9n OpenAI SDK h\u1ed7 tr\u1ee3 ph\u01b0\u01a1ng th\u1ee9c ti\u1ec7n l\u1ee3i `client.videos.create_and_poll()` v\u00e0 `client.videos.download_content()`:\n\n```python\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"sk-9r-xxxx\",\n    base_url=\"https://tuansuapi.store/v1\"\n)\n\n# 1. T\u1ea1o video Text-to-Video v\u00e0 t\u1ef1 \u0111\u1ed9ng ch\u1edd ho\u00e0n t\u1ea5t\nprint(\"\u0110ang g\u1eedi y\u00eau c\u1ea7u t\u1ea1o video...\")\nvideo = client.videos.create_and_poll(\n    model=\"seedance_2.5\",\n    prompt=\"Cinematic drone shot flying through futuristic neon Tokyo at night, 4k\",\n    seconds=\"10\",\n    size=\"1280x720\"\n)\nprint(\"Video \u0111\u00e3 t\u1ea1o xong! ID:\", video.id)\n\n# 2. T\u1ea3i tr\u1ef1c ti\u1ebfp video MP4 v\u1ec1 m\u00e1y\ncontent = client.videos.download_content(video.id)\ncontent.write_to_file(\"tokyo_neon.mp4\")\nprint(\"\u0110\u00e3 l\u01b0u video th\u00e0nh c\u00f4ng v\u00e0o file tokyo_neon.mp4!\")\n```\n\n---\n\n### 5.2. cURL: Text-to-Video & Image-to-Video\n\n#### a) Text-to-Video 16:9 v\u1edbi Seedance 2.5:\n```bash\ncurl -X POST \"https://tuansuapi.store/v1/videos\" \\\n  -H \"Authorization: Bearer sk-9r-xxxx\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"seedance_2.5\",\n    \"prompt\": \"Cinematic drone shot flying through futuristic neon Tokyo at night, 4k\",\n    \"seconds\": 10,\n    \"aspect_ratio\": \"16:9\"\n  }'\n```\n\n#### b) T\u1ea1o video t\u1eeb \u1ea3nh c\u00f3 s\u1eb5n (Image-to-Video):\n```bash\ncurl -X POST \"https://tuansuapi.store/v1/videos\" \\\n  -H \"Authorization: Bearer sk-9r-xxxx\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"seedance_2.0_fast\",\n    \"prompt\": \"The girl in the photo gently turns towards the camera and smiles\",\n    \"seconds\": 5,\n    \"size\": \"720x1280\",\n    \"input_reference\": {\n      \"image_url\": \"https://example.com/portrait.jpg\"\n    }\n  }'\n```\n\n#### c) Gh\u00e9p nhi\u1ec1u \u1ea3nh tham chi\u1ebfu (Subject & Style Reference):\n```bash\ncurl -X POST \"https://tuansuapi.store/v1/videos\" \\\n  -H \"Authorization: Bearer sk-9r-xxxx\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"seedance_2.5\",\n    \"prompt\": \"The character in image 1 walking with the puppy in image 2 across the street in image 3\",\n    \"seconds\": 10,\n    \"aspect_ratio\": \"16:9\",\n    \"input_reference\": [\n      { \"image_url\": \"https://example.com/char.jpg\" },\n      { \"image_url\": \"https://example.com/puppy.jpg\" },\n      { \"image_url\": \"https://example.com/background.jpg\" }\n    ]\n  }'\n```\n\n#### d) First Frame + Last Frame chuy\u1ec3n c\u1ea3nh m\u01b0\u1ee3t (Veo-3.1, 1080p):\n```bash\ncurl -X POST \"https://tuansuapi.store/v1/videos\" \\\n  -H \"Authorization: Bearer sk-9r-xxxx\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"Veo-3.1\",\n    \"prompt\": \"The flower bud in the morning slowly blossoms into a brilliant flower\",\n    \"seconds\": 8,\n    \"size\": \"1280x720\",\n    \"resolution\": \"1080p\",\n    \"input_reference\": { \"image_url\": \"https://example.com/bud.jpg\" },\n    \"last_frame\": { \"image_url\": \"https://example.com/bloom.jpg\" }\n  }'\n```\n\n#### e) H\u1ee7y b\u1ecf video job:\n```bash\ncurl -X DELETE \"https://tuansuapi.store/v1/videos/video_abc123\" \\\n  -H \"Authorization: Bearer sk-9r-xxxx\"\n```\n\n---\n\n### 5.3. Python Requests (Ch\u1ebf \u0111\u1ed9 \u0111\u1ed3ng b\u1ed9 nh\u1eadn k\u1ebft qu\u1ea3 ngay)\n\nN\u1ebfu kh\u00f4ng mu\u1ed1n vi\u1ebft v\u00f2ng l\u1eb7p polling, ch\u1ec9 c\u1ea7n th\u00eam `?sync=true`:\n\n```python\nimport requests\n\nAPI_KEY = \"sk-9r-xxxx\"\nURL = \"https://tuansuapi.store/v1/videos?sync=true\"\n\npayload = {\n    \"model\": \"seedance_2.0_fast\",\n    \"prompt\": \"A cute Golden Retriever puppy running happily in autumn park, 4k\",\n    \"seconds\": 5,\n    \"size\": \"720x1280\"\n}\n\nheaders = {\n    \"Authorization\": f\"Bearer {API_KEY}\",\n    \"Content-Type\": \"application/json\"\n}\n\nprint(\"\u0110ang t\u1ea1o video (H\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng ph\u00e1t ping gi\u1eef k\u1ebft n\u1ed1i ch\u1ed1ng timeout)...\")\nresp = requests.post(URL, headers=headers, json=payload, timeout=900)\ndata = resp.json()\n\nprint(\"Tr\u1ea1ng th\u00e1i:\", data.get(\"status\"))\nprint(\"Link video MP4:\", data.get(\"url\"))\n```\n\n---\n\n### 5.4. JavaScript / Node.js (Fetch API)\n\n```javascript\nimport fetch from \"node-fetch\";\n\nconst API_KEY = \"sk-9r-xxxx\";\n\nasync function createVideo() {\n  const res = await fetch(\"https://tuansuapi.store/v1/videos?sync=true\", {\n    method: \"POST\",\n    headers: {\n      \"Authorization\": `Bearer ${API_KEY}`,\n      \"Content-Type\": \"application/json\"\n    },\n    body: JSON.stringify({\n      model: \"seedance_2.5\",\n      prompt: \"Cinematic sunset over oceanic waves crashing against rocky cliffs, slow motion\",\n      seconds: 10,\n      size: \"1280x720\"\n    })\n  });\n\n  const data = await res.json();\n  console.log(\"Video MP4 URL:\", data.url);\n}\n\ncreateVideo();\n```\n\n---\n\n## 6. X\u1eec L\u00dd L\u1ed6I (ERROR CODES)\n\n| M\u00e3 l\u1ed7i | Nguy\u00ean nh\u00e2n | C\u00e1ch kh\u1eafc ph\u1ee5c |\n|---|---|---|\n| `400 Bad Request` | Tham s\u1ed1 `seconds`, `size` kh\u00f4ng t\u01b0\u01a1ng th\u00edch v\u1edbi model; qu\u00e1 s\u1ed1 l\u01b0\u1ee3ng \u1ea3nh cho ph\u00e9p; \u0111\u1ecbnh d\u1ea1ng kh\u00f4ng \u0111\u00fang. | Ki\u1ec3m tra b\u1ea3ng th\u00f4ng s\u1ed1 model \u1edf M\u1ee5c 2. \u0110\u1ecdc tr\u01b0\u1eddng `error.message` \u0111\u1ec3 bi\u1ebft chi ti\u1ebft. |\n| `401 Unauthorized` | API key kh\u00f4ng ch\u00ednh x\u00e1c ho\u1eb7c h\u1ebft h\u1ea1n. | Ki\u1ec3m tra l\u1ea1i header `Authorization: Bearer sk-9r-...`. |\n| `402 Payment Required`| S\u1ed1 d\u01b0 t\u00e0i kho\u1ea3n kh\u00f4ng \u0111\u1ee7 \u0111\u1ec3 render video. | N\u1ea1p th\u00eam s\u1ed1 d\u01b0 qua Bot Telegram ho\u1eb7c Web Portal. |\n| `404 Not Found` | Video ID kh\u00f4ng t\u1ed3n t\u1ea1i ho\u1eb7c kh\u00f4ng thu\u1ed9c quy\u1ec1n s\u1edf h\u1eefu c\u1ee7a API key. | Ki\u1ec3m tra l\u1ea1i `video_id` \u0111\u00e3 t\u1ea1o. |\n| `409 Conflict` | Kh\u00f4ng th\u1ec3 h\u1ee7y (`DELETE`) video v\u00ec \u0111\u00e3 render xong ho\u1eb7c \u0111ang trong qu\u00e1 tr\u00ecnh render. | Video \u0111\u00e3 b\u1eaft \u0111\u1ea7u render, vui l\u00f2ng \u0111\u1ee3i ho\u00e0n t\u1ea5t. |\n| `429 Too Many Requests`| H\u1ec7 th\u1ed1ng ho\u1eb7c nh\u00e0 cung c\u1ea5p \u0111ang qu\u00e1 t\u1ea3i t\u1ea1m th\u1eddi. | \u0110\u1ee3i v\u00e0i gi\u00e2y r\u1ed3i th\u1eed l\u1ea1i. |\n";
